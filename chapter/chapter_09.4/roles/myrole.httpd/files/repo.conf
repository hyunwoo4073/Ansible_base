# Alias /repo "/repo"


# Ubuntu
<VirtualHost *:80>
    DocumentRoot /repo
    Alias /repo /repo

    <Directory /repo>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    CustomLog ${APACHE_LOG_DIR}/http_repo.log combined
</VirtualHost>